dataset: emnist
data_dir: data/emnist
download: true
partition_method: dirichlet_semantic
dirichlet_alpha: 0.1
between_community: dirichlet  # alpha controls between-community label skew; "disjoint" = legacy
alpha_within: null  # null = IID split inside each community; a number = Dir(alpha_within) per class
n_classes: 62
