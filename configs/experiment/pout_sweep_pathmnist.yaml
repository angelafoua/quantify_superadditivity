# Parametric sweep over p_out for PathMNIST.
# Used to map the I(α, β) surface on a different dataset.

experiment_name: pout_sweep_pathmnist

data_levels:
  - pathmnist_iid
  - pathmnist_mild_noniid
  - pathmnist_noniid
  - pathmnist_severe_noniid

p_out_values: [0.07, 0.15, 0.3, 0.5]  # tuned for n_clients=16; lower values cannot form connected graphs
p_in: 0.7

run_seeds: [42]
graph_seeds: [100]

model: resnet18
training: default
