# Parametric sweep over p_out for DomainNet-126 (clipart).
# Used to map the I(α, β) surface on a different dataset.

experiment_name: pout_sweep_domainnet126

data_levels:
  - domainnet126_iid
  - domainnet126_mild_noniid
  - domainnet126_noniid
  - domainnet126_severe_noniid

p_out_values: [0.07, 0.15, 0.3, 0.5]  # tuned for n_clients=16; lower values cannot form connected graphs
p_in: 0.7

run_seeds: [42]
graph_seeds: [100]

model: resnet18
training: default
