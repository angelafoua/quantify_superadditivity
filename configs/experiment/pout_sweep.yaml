# Parametric sweep over p_out for fixed data conditions.
# Used to map the I(α, β) surface.

experiment_name: pout_sweep

data_levels:
  - iid
  - mild_noniid
  - moderate_noniid
  - severe_noniid

p_out_values: [0.005, 0.01, 0.02, 0.05, 0.1, 0.15, 0.2, 0.3]
p_in: 0.3

run_seeds: [42, 123, 456]
graph_seeds: [100, 200, 300]

model: resnet18
training: default
