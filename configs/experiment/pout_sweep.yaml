# Parametric sweep over p_out for fixed data conditions.
# Used to map the I(α, β) surface.

experiment_name: pout_sweep

data_levels:
  - iid
  - mild_noniid
  - moderate_noniid
  - severe_noniid

p_out_values: [0.07, 0.15, 0.3, 0.5]  # tuned for n_clients=16; lower values cannot form connected graphs
p_in: 0.7

run_seeds: [42]
graph_seeds: [100]

model: resnet18
training: default
