algorithm: dsgd
total_rounds: 500
local_steps: 1
batch_size: 64

optimizer:
  lr: 0.1
  momentum: 0.9
  weight_decay: 1.0e-4

lr_schedule:
  type: cosine
  lr_min: 1.0e-4
  warmup_rounds: 5

eval_every: 10
# Gossip BatchNorm running statistics as well as parameters. false: each
# client keeps statistics of its own data (FedBN-style) and is evaluated
# with them, so drift includes BatchNorm-statistic divergence. Run a
# subset with true as a control.
mix_bn_buffers: false
checkpoint_every: 50
