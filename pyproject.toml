[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "superadditivity"
version = "0.1.0"
description = "Beyond Additive Heterogeneity: Quantifying Superadditive Interaction Effects in Decentralized Federated Learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lou Angela Foua" },
]
keywords = [
    "decentralized-learning",
    "federated-learning",
    "superadditivity",
    "representation-drift",
    "cka",
    "graph-topology",
    "interaction-effects",
]

dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "networkx>=3.1",
    "h5py>=3.9.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.2",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    "tqdm>=4.65.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.15.0"]
umap = ["umap-learn>=0.5.4"]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "ruff>=0.0.287",
    "mypy>=1.5.0",
]
notebooks = ["jupyter>=1.0.0", "ipykernel>=6.25.0"]

[project.scripts]
superadditivity-run = "scripts.run_experiment:main"

[tool.setuptools.packages.find]
include = ["superadditivity*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
